[package]
name = "php-lsp-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PHP Language Server (LSP 3.17) written in Rust"

[lib]
name = "php_lsp_server"
path = "src/lib.rs"

[[bin]]
name = "php-lsp"
path = "src/main.rs"

[dependencies]
php-lsp-types = { workspace = true }
php-lsp-parser = { workspace = true }
php-lsp-index = { workspace = true }
php-lsp-completion = { workspace = true }
tower-lsp = { workspace = true }
lsp-types = { workspace = true }
tokio = { workspace = true }
dashmap = { workspace = true }
file-id = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tree-sitter = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tower = "0.5"
futures = "0.3"
